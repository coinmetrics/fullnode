build bitcoin-zmce:
  extends: .generic-build
  variables:
    FULLNODE: bitcoin-zmce
    VERSION: "32_0"
    KUBERNETES_MEMORY_REQUEST: "48Gi"
    KUBERNETES_MEMORY_LIMIT: "48Gi"

publish bitcoin-zmce:
